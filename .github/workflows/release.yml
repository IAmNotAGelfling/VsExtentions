name: Release VSIX

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

jobs:
  release:
    runs-on: windows-latest

    env:
      SOLUTION_FILE: FilePathOnDocument.slnx
      CONFIGURATION: Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

    - name: Find VSIX file
      id: find-vsix
      run: |
        $vsixFile = Get-ChildItem -Path "src" -Filter "*.vsix" -Recurse | Select-Object -First 1
        if ($null -eq $vsixFile) {
          Write-Error "No VSIX file found!"
          exit 1
        }
        $vsixPath = $vsixFile.FullName
        $vsixName = $vsixFile.Name
        Write-Host "Found VSIX: $vsixPath"
        echo "vsix-path=$vsixPath" >> $env:GITHUB_OUTPUT
        echo "vsix-name=$vsixName" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ steps.find-vsix.outputs.vsix-path }}
        body: |
          ## FilePathOnDocument Extension Release ${{ github.ref_name }}

          Download the VSIX file below and install it in Visual Studio 2022.

          ### Installation
          1. Download `${{ steps.find-vsix.outputs.vsix-name }}`
          2. Close Visual Studio
          3. Double-click the VSIX file to install
          4. Restart Visual Studio

          ### Features
          - Display file paths in VS editor margin
          - Configurable path display options
          - Quick copy actions (file name, full path, project/solution relative, namespace)
          - Customisable separators and alignment

          See the [README](https://github.com/IAmNotAGelfling/VsExtentions/blob/main/README.md) for full details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
