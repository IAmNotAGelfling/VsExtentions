name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      SOLUTION_FILE: VsExtensions.slnx
      CONFIGURATION: Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      if: always()
      with:
        files: '**/test-results.trx'
        check_name: Test Results

    - name: Check for build warnings
      run: |
        if (Select-String -Path "*.log" -Pattern "warning" -Quiet) {
          Write-Host "Build completed with warnings"
          exit 0
        }
      shell: pwsh

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v7
      with:
        name: vsix-package
        path: src/**/bin/${{ env.CONFIGURATION }}/**/*.vsix
        if-no-files-found: error

    - name: Check VSIX was created
      run: |
        $vsixFiles = Get-ChildItem -Path "src" -Filter "*.vsix" -Recurse
        if ($vsixFiles.Count -eq 0) {
          Write-Error "No VSIX file was created!"
          exit 1
        }
        Write-Host "✓ VSIX file created: $($vsixFiles[0].FullName)"
      shell: pwsh
